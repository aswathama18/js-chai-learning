<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn JavaScript</title>
</head>
<body style="background-color: #212121; color: #fff;">
    
</body>
<script>
    const div = document.createElement('div')
    console.log(div);
    div.className = "main"
    div.id = Math.round(Math.random() * 10 + 1) 
    div.setAttribute("title", "generated Title") //optimized code set the text direct into element , saves the time of roundtrip
    div.style.backgroundColor = "green"
    div.style.padding = "12px"
    // div.innerText = "Maharaj Hukum chaudhary ki jai ho"  //innertext makes a round trip to access the value of element 
    const addtext = document.createTextNode("Hukum Chaudhary ki jai")
    div.appendChild(addtext)

    document.body.appendChild(div)
</script>
</html>
